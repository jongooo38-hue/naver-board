name: 종목 목록 갱신

on:
  schedule:
    - cron: "0 23 * * 0-4"   # 평일 08:00 KST (UTC 기준 전날 23:00)
  workflow_dispatch:          # 사이트 설정의 "지금 갱신" → Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 build.py
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: 종목 목록 갱신"
          git push
