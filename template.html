<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03c75a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>종목토론방</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#111; --sub:#888; --line:#e5e7eb; --accent:#03c75a; --hi:#eefbf3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --card:#1e1e1e; --text:#eee; --sub:#999; --line:#333; --hi:#17301f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:8px 0 12px; }
  h1 span { color:var(--accent); }
  .box { position:relative; }
  input { width:100%; font-size:18px; padding:14px 16px; border:2px solid var(--accent); border-radius:12px; background:var(--card); color:var(--text); outline:none; }
  ul { list-style:none; margin:6px 0 0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  ul:empty { display:none; }
  li { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  li:last-child { border-bottom:0; }
  li.on, li:hover { background:var(--hi); }
  li b { font-weight:600; }
  li small { color:var(--sub); font-size:13px; }
  .recent { margin-top:18px; }
  .recent h2 { font-size:13px; color:var(--sub); font-weight:500; margin:0 0 8px; display:flex; justify-content:space-between; }
  .recent h2 button { border:0; background:none; color:var(--sub); font-size:12px; cursor:pointer; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips a { padding:8px 12px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--text); text-decoration:none; font-size:14px; }
  .hint { color:var(--sub); font-size:12px; margin-top:24px; line-height:1.6; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  #gear { border:0; background:none; font-size:22px; color:var(--sub); cursor:pointer; padding:4px 8px; }
  dialog { border:0; border-radius:16px; padding:20px; width:min(92vw, 380px); background:var(--card); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog h3 { margin:0 0 14px; font-size:16px; }
  dialog dl { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0 0 16px; font-size:14px; }
  dialog dt { color:var(--sub); }
  dialog dd { margin:0; }
  .btn { display:block; width:100%; text-align:center; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; text-decoration:none; cursor:pointer; margin-top:8px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  dialog p { color:var(--sub); font-size:12px; line-height:1.6; margin:6px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span>■</span> 종목토론방 바로가기</h1>
    <button id="gear" title="설정" aria-label="설정">⚙</button>
  </div>
  <div class="box">
    <input id="q" type="search" placeholder="종목명 · 초성 · 코드" autocomplete="off" autofocus>
    <ul id="list"></ul>
  </div>
  <div class="recent" id="recentBox" hidden>
    <h2>최근 본 종목 <button id="clear">지우기</button></h2>
    <div class="chips" id="recent"></div>
  </div>
  <div class="hint">Enter = 첫 번째 종목 열기 · ↑↓ 선택 · PC는 새 탭, 폰은 모바일 토론방으로 열립니다.</div>
</div>
<dialog id="settings">
  <h3>설정</h3>
  <dl>
    <dt>종목 목록</dt><dd id="sCount"></dd>
    <dt>마지막 갱신</dt><dd id="sUpdated"></dd>
  </dl>
  <a class="btn primary" href="https://github.com/jongooo38-hue/naver-board/actions/workflows/update.yml" target="_blank" rel="noopener">지금 종목 목록 갱신</a>
  <p>GitHub 화면에서 <b>Run workflow</b>를 누르면 1~2분 뒤 반영됩니다. 평일 오전 8시에는 자동으로 갱신됩니다.</p>
  <button class="btn" id="sClear">최근 본 종목 지우기</button>
  <button class="btn" id="sClose">닫기</button>
</dialog>
<script>
const STOCKS = /*STOCKS*/[];
const UPDATED = /*UPDATED*/"";
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
// 자주 쓰는 줄임말
const ALIAS = { "삼전":"005930", "하닉":"000660", "엘지엔솔":"373220", "엔솔":"373220", "현차":"005380", "삼바":"207940", "에코비엠":"247540", "포홀":"005490" };

const MARKET_RANK = { "코스피":0, "코스닥":1, "코넥스":2 };  // 동점이면 코스피 먼저
const toCho =s => [...s].map(c => {
  const n = c.charCodeAt(0) - 0xAC00;
  return n >= 0 && n < 11172 ? CHO[Math.floor(n / 588)] : c;
}).join("");
const norm = s => s.toLowerCase().replace(/\s+/g, "");
const items = STOCKS.map(([name, code, market]) => ({ name, code, market, key: norm(name), cho: toCho(norm(name)) }));
const byCode = Object.fromEntries(items.map(it => [it.code, it]));

const url = code => isMobile
  ? `https://m.stock.naver.com/domestic/stock/${code}/discussion`
  : `https://stock.naver.com/domestic/stock/${code}/discussion`;

function search(raw) {
  const q = norm(raw);
  if (!q) return [];
  const isCho = /^[ㄱ-ㅎ]+$/.test(q);
  const scored = [];
  for (const it of items) {
    let s = -1;
    if (it.code === q.toUpperCase()) s = 0;
    else if (isCho) { const i = it.cho.indexOf(q); if (i >= 0) s = i === 0 ? 2 : 4; }
    else {
      const i = it.key.indexOf(q);
      if (i === 0) s = 1; else if (i > 0) s = 3;
      else if (it.code.startsWith(q.toUpperCase())) s = 5;
    }
    if (s >= 0) scored.push([s, MARKET_RANK[it.market] ?? 3, it.name.length, it]);
  }
  scored.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  const out = scored.slice(0, 10).map(x => x[3]);
  const alias = ALIAS[q] && byCode[ALIAS[q]];
  if (alias) out.unshift(...[alias].filter(a => !out.includes(a)));
  return out.slice(0, 10);
}

const $q = document.getElementById("q"), $list = document.getElementById("list");
let results = [], sel = 0;

function render() {
  $list.innerHTML = results.map((it, i) =>
    `<li class="${i === sel ? "on" : ""}" data-i="${i}"><b>${it.name}</b><small>${it.code} · ${it.market}</small></li>`).join("");
}
function openStock(it) {
  if (!it) return;
  saveRecent(it.code);
  if (isMobile) location.href = url(it.code);
  else window.open(url(it.code), "_blank");
  $q.value = ""; results = []; render(); $q.focus();
}

$q.addEventListener("input", () => { results = search($q.value); sel = 0; render(); });
$q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, results.length - 1); render(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
  else if (e.key === "Enter") {
    // 한글 조합 중 Enter도 바로 처리 (두 번 눌러야 하는 문제 방지). 열고 나면 입력이 비워져 중복 Enter는 무시됨
    if (e.isComposing) { results = search($q.value); sel = 0; }
    openStock(results[sel]); e.preventDefault();
  }
  else if (e.key === "Escape") { $q.value = ""; results = []; render(); }
});
$list.addEventListener("click", e => { const li = e.target.closest("li"); if (li) openStock(results[+li.dataset.i]); });

// 최근 본 종목 (이 기기에만 저장)
function loadRecent() { try { return JSON.parse(localStorage.getItem("recent") || "[]"); } catch { return []; } }
function saveRecent(code) {
  const r = [code, ...loadRecent().filter(c => c !== code)].slice(0, 10);
  try { localStorage.setItem("recent", JSON.stringify(r)); } catch {}
  setTimeout(drawRecent);  // 클릭한 링크가 이동하기 전에 지워지지 않도록
}
function drawRecent() {
  const r = loadRecent().map(c => byCode[c]).filter(Boolean).slice(0, 10);
  document.getElementById("recentBox").hidden = !r.length;
  document.getElementById("recent").innerHTML = r.map(it =>
    `<a href="${url(it.code)}" ${isMobile ? "" : 'target="_blank"'} data-code="${it.code}">${it.name}</a>`).join("");
}
document.getElementById("recent").addEventListener("click", e => {
  const a = e.target.closest("a"); if (a) saveRecent(a.dataset.code);
});
document.getElementById("clear").addEventListener("click", () => { try { localStorage.removeItem("recent"); } catch {} drawRecent(); });
drawRecent();

// 설정 창
const $settings = document.getElementById("settings");
document.getElementById("sCount").textContent = `${items.length.toLocaleString()}종목 (KRX 상장법인)`;
document.getElementById("sUpdated").textContent = UPDATED || "알 수 없음";
document.getElementById("gear").addEventListener("click", () => $settings.showModal());
document.getElementById("sClose").addEventListener("click", () => $settings.close());
document.getElementById("sClear").addEventListener("click", () => {
  try { localStorage.removeItem("recent"); } catch {}
  drawRecent(); $settings.close();
});
$settings.addEventListener("click", e => { if (e.target === $settings) $settings.close(); });  // 바깥 누르면 닫기
</script>
</body>
</html>
